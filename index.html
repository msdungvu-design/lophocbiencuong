<style>

  .lang{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:20px;overflow:hidden}

  main{max-width:1100px;margin:0 auto;padding:26px 18px 60px}
  .page{animation:fade .35s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1.title{font-size:30px;margin:0 0 6px;color:var(--dark)}
  .kicker{display:inline-block;background:#E7EEF0;color:var(--dark);font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:14px;letter-spacing:.4px}
  .lead{font-size:16px;color:#33454c;max-width:760px}
  section.blk{margin:26px 0}
  section.blk h2{font-size:20px;color:var(--dark);margin:0 0 10px;display:flex;align-items:center;gap:10px}
  section.blk h2::before{content:"";width:6px;height:20px;background:var(--gold);border-radius:3px;display:inline-block}
  p{margin:0 0 12px}
  .hero{background:linear-gradient(135deg,var(--dark),#12657f);color:#fff;border-radius:16px;padding:38px 30px}
  .hero h1{font-size:34px;margin:0 0 4px}.hero .en{color:var(--gold);font-weight:800;letter-spacing:2px;font-size:16px;margin-bottom:14px}
  .hero p{color:#d7e7ec;max-width:640px}
  .hero .scene{width:100%;height:150px;margin-top:22px;border-radius:12px;display:block}
  .banner{width:100%;height:120px;border-radius:12px;display:block;margin:0 0 18px}
  .btns{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap}
  .btn{border:0;font:inherit;font-weight:700;padding:11px 18px;border-radius:9px;cursor:pointer}
  .btn.gold{background:var(--gold);color:#3a2a06}.btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.4)}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}
  .kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;text-align:center}
  .kpi .n{font-size:30px;font-weight:800;color:var(--dark)}.kpi .l{font-size:12.5px;color:var(--mut);margin-top:4px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;overflow:hidden}
  .card img{width:100%;border-radius:8px;margin-bottom:10px;display:block}
  .card h3{margin:0 0 6px;font-size:15.5px;color:var(--dark)}.card p{font-size:14px;color:#3d4d54;margin:0}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;margin-top:9px}

  .ph img{width:100%;display:block}
  .ph .inner{padding:16px}
  .ph .ico{font-size:26px}.ph b{display:block;color:var(--dark);margin:6px 0 2px}.ph small{font-size:12px}

  .ptitle{display:block;font-weight:600;color:var(--dark);font-size:14px;line-height:1.45}

  .hlcard{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--gold);border-radius:12px;padding:18px}
  .hlcard h3{margin:0 0 6px;font-size:16px;color:var(--dark)}
  .hlcard p{margin:0;font-size:14px;color:#3d4d54}
  .recog{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
  .recog-l{font-weight:700;color:var(--mut);font-size:13px}
  .rbadge{background:#E7EEF0;color:var(--dark);font-weight:700;font-size:12.5px;padding:4px 11px;border-radius:20px}
  .rmore{margin-left:auto;background:none;border:0;color:var(--teal);font-weight:700;font-size:13px;cursor:pointer}
  @media(max-width:720px){.hl{grid-template-columns:1fr}.rmore{margin-left:0}}
  .info{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px}
  .info .row{padding:8px 0;border-bottom:1px solid #eef2f3;font-size:14.5px}.info .row:last-child{border-bottom:0}.info .row b{color:var(--dark)}
  .note{background:#fff7e9;border:1px solid #eac98a;border-radius:12px;padding:14px 16px;font-size:13.5px;color:#6b5417;margin-top:16px}
  .ptable{width:100%;border-collapse:collapse;font-size:14px;min-width:600px}
  .ptable th{background:var(--dark);color:#fff;text-align:left;padding:9px 11px;font-size:13px;font-weight:700}
  .ptable td{border:1px solid var(--bd);padding:9px 11px;vertical-align:top;background:#fff;color:#3d4d54}
  .ptable .pnum{text-align:center;font-weight:800;color:var(--dark)}
  .ptable tr:nth-child(even) td{background:#f7fafb}
  .vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .vcard{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;display:flex;flex-direction:column;min-height:250px}
  .vtop{display:flex;justify-content:center;margin-bottom:10px}
  .vtop img{width:64px;height:64px;border-radius:50%;object-fit:cover}
  .vph{width:64px;height:64px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
  .vquote{margin:0;font-style:italic;color:#33454c;font-size:13.5px;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
  .vquote.open{-webkit-line-clamp:unset;overflow:visible}
  .rm{align-self:flex-start;background:none;border:0;color:var(--teal);font-weight:700;font-size:12.5px;cursor:pointer;padding:5px 0}
  .vfoot{margin-top:auto;padding-top:10px;border-top:1px solid #eef2f3;text-align:center}
  .vname{font-weight:800;color:var(--dark);font-size:14px}
  .vrole{font-size:12px;color:var(--mut)}
  @media(max-width:900px){.vgrid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.vgrid{grid-template-columns:1fr}}
  footer{background:var(--dark);color:#cfe0e5;font-size:13px;text-align:center;padding:20px;margin-top:30px}
  @media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:26px}}
</style>

order region.","highlights":[{"title_vi":"Từ Cao Bằng ra thế giới","title_en":"From Cao Bang to the world","desc_vi":"Kể câu chuyện Việt Nam bằng tiếng Anh ngay từ vùng biên giới, qua trải nghiệm thật.","desc_en":"Telling Vietnam’s story in English right from the border, through real experience."},{"title_vi":"Người dân là chủ thể kể chuyện","title_en":"Local people as storytellers","desc_vi":"Trẻ em và cán bộ cơ sở trở thành người giới thiệu quê hương, văn hóa, con người Việt Nam.","desc_en":"Children and grassroots officials become ambassadors for their homeland and culture."},{"title_vi":"Được báo chí ghi nhận","title_en":"Recognised by the press","desc_vi":"Báo Cao Bằng, Đài PT-TH Cao Bằng, Báo Thanh Niên, Tỉnh Đoàn và Trung ương Đoàn đưa tin.","desc_en":"Covered by Cao Bang Newspaper, provincial broadcasting, Thanh Nien Newspaper and the Youth Union."}],"context":[{"h_vi":"Một nghịch lý ở vùng biên","h_en":"A paradox at the border","p_vi":"Cao Bằng là tỉnh biên giới phía Bắc, sở hữu Thác Bản Giốc, Công viên địa chất toàn cầu UNESCO Non nước Cao Bằng và dòng khách quốc tế ngày càng tăng. Nhưng ngay tại địa bàn giàu tiềm năng giao lưu ấy, trẻ em vùng cao, thanh niên và cán bộ cơ sở lại thiếu môi trường thực hành ngoại ngữ và cơ hội giao tiếp quốc tế trực tiếp.","p_en":"Cao Bang is a northern border province, home to Ban Gioc Waterfall, the UNESCO Global Geopark and a growing flow of international visitors. Yet in this exchange-rich land, highland children, youth and grassroots officials still lack an environment to practise foreign languages and to interact directly with international guests."},{"h_vi":"Thông tin đối ngoại bắt đầu từ cơ sở","h_en":"External information starts at the grassroots","p_vi":"Thông tin đối ngoại không chỉ diễn ra qua báo chí hay diễn đàn chính thức, mà trong từng cuộc gặp giữa người dân địa phương với khách quốc tế: một lời chào, một câu chỉ đường, một câu giới thiệu quê hương bằng tiếng Anh. “Lớp học biên cương” biến những điểm chạm đó thành kênh đối ngoại nhân dân.","p_en":"External information does not only happen through the press or official forums, but in every encounter between local people and international guests: a greeting, directions, an introduction of one’s homeland in English. “Border Classroom” turns these touchpoints into a people-to-people channel."}],"done_cards":[{"title_vi":"Trẻ em – Trung tâm Bảo trợ xã hội tỉnh","title_en":"Children – Provincial Social Protection Centre","body_vi":"04 lớp · 71 học viên · 35 tình nguyện viên (2025–2026), phối hợp Tỉnh Đoàn Cao Bằng.","body_en":"04 classes · 71 learners · 35 volunteers (2025–2026), with Cao Bang Youth Union.","tag_vi":"Đã làm","tag_en":"Done","image":"e_tnv_baotro_2025.jpg"},{"title_vi":"Trẻ em – phường Nùng Trí Cao","title_en":"Children – Nung Tri Cao ward","body_vi":"03 lớp · 80 học viên · 30 tình nguyện viên (2026), phối hợp Đoàn phường Nùng Trí Cao.","body_en":"03 classes · 80 learners · 30 volunteers (2026), with the ward Youth Union.","tag_vi":"Đã làm","tag_en":"Done","image":"f_nungtricao_2026.jpg"},{"title_vi":"Cán bộ cơ sở – phường Thục Phán","title_en":"Officials – Thuc Phan ward","body_vi":"02 lớp tiếng Anh giao tiếp cho cán bộ, công chức; thực hành thực tế tại Phố đi bộ Kim Đồng.","body_en":"02 communication-English classes for officials; real practice at Kim Dong Walking Street.","tag_vi":"Đã làm","tag_en":"Done","image":"a_thucphan_kyket.jpg"}],"done_note_vi":"Giáo viên và học liệu do Clever Junior đảm nhiệm; huy động đoàn viên, sinh viên ngoại ngữ làm trợ giảng, tình nguyện viên. Hoạt động được truyền thông địa phương ghi nhận (Báo Cao Bằng, kênh Đoàn) và có văn bản phối hợp chính thức với các đơn vị.","done_note_en":"Teachers and materials provided by Clever Junior; youth-union members and language students served as teaching assistants and volunteers. Activities were covered by local media (Cao Bang Newspaper, Youth Union channels) and backed by formal cooperation documents.","tiers":[{"a_vi":"1 · Giáo dục cộng đồng","a_en":"1 · Community education","b_vi":"Dạy tiếng Anh miễn phí, giao tiếp, trải nghiệm cho trẻ em và cán bộ cơ sở.","b_en":"Free, communicative, experiential English for children and grassroots officials."},{"a_vi":"2 · Giao lưu văn hóa","a_en":"2 · Cultural exchange","b_vi":"Từ mỗi điểm chạm đời thường — một lời chào, một câu chỉ đường, một câu giới thiệu quê hương bằng tiếng Anh — lớp học trở thành không gian giao lưu văn hóa giữa cộng đồng địa phương với khách/người nước ngoài hợp pháp.","b_en":"From everyday touchpoints — a greeting, directions, an introduction to one’s homeland in English — the classroom becomes a space for cultural exchange between the local community and lawful international guests."},{"a_vi":"3 · Thông tin đối ngoại nhân dân","a_en":"3 · People-to-people external information","b_vi":"Những điểm chạm ấy trở thành kênh đối ngoại nhân dân dựa trên trải nghiệm thật: trẻ em, cán bộ là “chủ thể kể chuyện” về quê hương, văn hóa, con người Việt Nam bằng tiếng Anh — thay cho thông điệp một chiều.","b_en":"These touchpoints become a people-to-people external-information channel grounded in real experience: children and officials become “storytellers” of Vietnam’s homeland, culture and people in English — instead of one-way messaging."}],"model_cards":[{"title_vi":"Trạm dừng chân giáo dục","title_en":"Educational Stopover","body_vi":"Điểm giao lưu văn hóa ngắn (2–3 giờ), an toàn, có kiểm soát. ĐÂY KHÔNG phải mô hình đưa người nước ngoài vào lớp dạy học, mà là điểm giao lưu văn hóa có giám sát; chỉ dành cho khách quốc tế nhập cảnh hợp pháp hoặc người nước ngoài có giấy phép hợp lệ, và chỉ triển khai sau khi hoàn thiện khung pháp lý.","body_en":"A short (2–3h), safe, controlled cultural-exchange point. This is NOT a model that brings foreigners in to teach; it is a supervised cultural exchange, only for lawfully-entered visitors or foreigners with valid permits, and only after the legal framework is completed.","tag_vi":"Đề xuất – định hướng","tag_en":"Proposed – direction","tagclass":"plan"},{"title_vi":"Cơ chế an toàn 4 lớp","title_en":"4-layer safety mechanism","body_vi":"Sàng lọc đầu vào · Bộ Quy tắc ứng xử bảo vệ trẻ em · Tập huấn trước khi tham gia · Giám sát tại chỗ.","body_en":"Screening · Child-protection code of conduct · Pre-activity training · On-site supervision.","tag_vi":"Một phần đã áp dụng","tag_en":"Partly applied","tagclass":"doing"},{"title_vi":"Quản lý yếu tố nước ngoài – chỉ người hợp pháp","title_en":"Foreign element – lawful persons only","body_vi":"Chỉ mời khách du lịch nhập cảnh hợp pháp tham gia giao lưu văn hóa (không giảng dạy, không nhận thù lao), hoặc người nước ngoài có giấy phép lao động/cư trú hợp lệ tại địa phương. Việc giảng dạy do giáo viên hợp pháp đảm nhiệm; không để người nước ngoài dạy độc lập hay tiếp xúc riêng với trẻ em.","body_en":"Only lawfully-entered tourists joining short cultural exchange (no teaching, no payment), or foreigners holding valid work/residence permits locally. Teaching is done by legally-permitted teachers; foreigners never teach alone or meet children privately.","tag_vi":"Nguyên tắc bắt buộc","tag_en":"Mandatory principle","tagclass":"doing"}],"roadmap":[{"when_vi":"Bước 1 · 2025–2026","when_en":"Step 1 · 2025–2026","h_vi":"Chuẩn hóa mô hình & giáo trình","h_en":"Standardise the model & curriculum","p_vi":"Hoàn thiện khung bài giảng song ngữ theo chủ đề “giới thiệu Cao Bằng”, quy trình lớp học và bộ quy tắc an toàn trẻ em.","p_en":"Finalise the bilingual lesson framework on “introducing Cao Bang”, class procedures and the child-safety code.","s_vi":"Đang làm","s_en":"In progress","sclass":"doing"},{"when_vi":"Bước 2","when_en":"Step 2","h_vi":"Sản phẩm truyền thông số","h_en":"Digital communication products","p_vi":"Đã hoàn thành website song ngữ và mã QR minh chứng; đang phát triển video ngắn 3–5 phút và bản tóm tắt tiếng Anh.","p_en":"Bilingual website and QR evidence completed; short 3–5 minute video and English summary in development.","s_vi":"Đang làm","s_en":"In progress","sclass":"doing"},{"when_vi":"Bước 3 · 2026","when_en":"Step 3 · 2026","h_vi":"Hoàn thiện khung pháp lý & an toàn","h_en":"Complete the legal & safety framework","p_vi":"Phối hợp Sở Ngoại vụ, Công an tỉnh xây dựng quy trình xác minh, đăng ký hoạt động có yếu tố nước ngoài (theo Nghị định 219/2025 & quy định tạm trú).","p_en":"Work with the Department of External Relations and provincial police to build verification and registration procedures for activities involving foreigners.","s_vi":"Kế hoạch","s_en":"Planned","sclass":"plan"},{"when_vi":"Bước 4 · 2026","when_en":"Step 4 · 2026","h_vi":"Thí điểm “Trạm dừng chân giáo dục” có kiểm soát","h_en":"Pilot the controlled “education stopover”","p_vi":"Thí điểm có kiểm soát tại 1–2 điểm trên tuyến du lịch Cao Bằng; chỉ mời người nước ngoài hợp pháp, có giám sát của giáo viên/cán bộ Việt Nam.","p_en":"Controlled pilot at 1–2 points on the Cao Bang tourist route; only lawful foreigners, supervised by Vietnamese teachers/officials.","s_vi":"Kế hoạch","s_en":"Planned","sclass":"plan"},{"when_vi":"Bước 5","when_en":"Step 5","h_vi":"Đào tạo đội ngũ & chuẩn hóa vận hành","h_en":"Train the team & standardise operations","p_vi":"Bộ tài liệu tập huấn cho giáo viên, tình nguyện viên; quy chuẩn ứng xử và truyền thông.","p_en":"Training materials for teachers and volunteers; standards for conduct and communication.","s_vi":"Kế hoạch","s_en":"Planned","sclass":"plan"},{"when_vi":"Bước 6","when_en":"Step 6","h_vi":"Đo lường & báo cáo","h_en":"Measure & report","p_vi":"Bộ chỉ số: số lớp, số học viên, lượt tiếp cận truyền thông, phản hồi quốc tế; báo cáo định kỳ.","p_en":"Metrics: classes, learners, media reach, international feedback; periodic reporting.","s_vi":"Kế hoạch","s_en":"Planned","sclass":"plan"},{"when_vi":"Bước 7 · Dài hạn","when_en":"Step 7 · Long-term","h_vi":"Nhân rộng có kiểm soát","h_en":"Controlled replication","p_vi":"Mở rộng sang địa bàn biên giới tương đồng khi bảo đảm đồng thuận địa phương, an toàn trẻ em và quản lý yếu tố nước ngoài.","p_en":"Expand to comparable border areas once local consensus, child safety and management of foreign involvement are ensured.","s_vi":"Định hướng","s_en":"Direction","sclass":"plan"}],"evidence_intro_vi":"Khu vực tổng hợp minh chứng bằng liên kết/QR để hội đồng và bạn bè quốc tế truy cập nhanh. (Các ô dưới đây là chỗ chờ – biên tập viên chèn link/ảnh thật trước khi nộp.)","evidence_intro_en":"A hub gathering evidence via links/QR for the jury and international audiences. (The tiles below are placeholders — insert real links/images before submission.)","media":[{"icon":"▶","label_vi":"Video tổng quan (3–5’)","label_en":"Overview video (3–5’)","note_vi":"Song ngữ · dán link YouTube","note_en":"Bilingual · paste a YouTube link","link":"","image":""},{"icon":"▶","label_vi":"Video lớp trẻ em","label_en":"Children’s class video","note_vi":"Dán link YouTube","note_en":"Paste a YouTube link","link":"","image":""},{"icon":"▶","label_vi":"Video lớp cán bộ – Phố đi bộ Kim Đồng","label_en":"Officials’ class – Kim Dong Street","note_vi":"Dán link YouTube","note_en":"Paste a YouTube link","link":"","image":""},{"icon":"🖼","label_vi":"Album ảnh lớp học & lễ ký kết","label_en":"Photo album & signing ceremonies","note_vi":"Ảnh trẻ em đã làm mờ mặt / có đồng ý","note_en":"Children’s images blurred / consented","link":"","image":""}],"press":[{"source":"Tỉnh Đoàn Cao Bằng","title_vi":"Khởi động Dự án “Tiếng Anh cộng đồng” và ra mắt Câu lạc bộ Ngoại ngữ Thanh niên hội nhập","title_en":"Launch of the Community English project & the Youth Integration Language Club","url":"https://tinhdoan.caobang.gov.vn/index.php/hoat-dong-doan/khoi-dong-du-an-tieng-anh-cong-dong-va-ra-mat-cau-lac-bo-ngoai-ngu-thanh-nien-hoi-nhap-3301.html","image":"d_ra_mat_clb.jpg"},{"source":"Trung ương Đoàn (Facebook)","title_vi":"Cao Bằng khởi động Dự án “Tiếng Anh cộng đồng”, ra mắt Câu lạc bộ Ngoại ngữ Thanh niên","title_en":"Cao Bang launches the Community English project & Youth Language Club","url":"https://www.facebook.com/Trunguongdoan/posts/1345038791148069/","image":"g_baotro_2026.jpg"},{"source":"Đài PT-TH Cao Bằng","title_vi":"Phường Thục Phán ký kết hợp tác đào tạo tiếng Anh cho cán bộ, công chức, viên chức","title_en":"Thuc Phan ward signs an English-training cooperation for officials","url":"http://caobangtv.gov.vn/xa-hoi/phuong-thuc-phan-ky-ket-hop-tac-dao-tao-tieng-anh-cho-can-bo-ccvc-1052374","image":"a_thucphan_kyket.jpg"},{"source":"Báo Cao Bằng","title_vi":"Khai giảng 3 lớp tiếng Anh cộng đồng cho trẻ em có hoàn cảnh khó khăn tại phường Nùng Trí Cao","title_en":"Opening 3 community English classes for disadvantaged children in Nung Tri Cao ward","url":"https://baocaobang.vn/khai-giang-3-lop-tieng-anh-cong-dong-danh-cho-tre-em-co-hoan-canh-kho-khan-tren-dia-ban-phuong-nung--3189183.html","image":"f_nungtricao_2026.jpg"},{"source":"Báo Thanh Niên","title_vi":"Dạy tiếng Anh miễn phí cho thiếu nhi khó khăn","title_en":"Free English lessons for disadvantaged children","url":"https://thanhnien.vn/day-tieng-anh-mien-phi-cho-thieu-nhi-kho-khan-18525061616483278.htm","image":"h_daytienganh_2025.jpg"},{"source":"Tỉnh Đoàn Cao Bằng","title_vi":"Khởi động Dự án “Tiếng Anh cộng đồng”, tư vấn chăm sóc sức khỏe tâm thần cho thiếu nhi năm 2025","title_en":"Community English project & child mental-health counselling, 2025","url":"https://tinhdoan.caobang.gov.vn/index.php/tin-tuc/khoi-dong-du-an-tieng-anh-cong-dong-tu-van-cham-soc-suc-khoe-tam-than-cho-thieu-nhi-nam-2025-3082.html","image":"b_tienganh_congdong.jpg"}],"voices_intro_vi":"Những gương mặt dưới đây là một số đại diện tiêu biểu cho đội ngũ giáo viên, trợ giảng và tình nguyện viên đã đồng hành cùng sáng kiến, góp phần đưa các lớp học tiếng Anh cộng đồng đến gần hơn với trẻ em, cán bộ cơ sở và người dân địa phương. Trong đó có một số bạn bè quốc tế đang làm việc hợp pháp tại Hà Nội, sẵn sàng đồng hành khi mô hình “điểm trạm giao lưu văn hóa” được triển khai theo đúng khung pháp lý.","voices_intro_en":"The faces below are a few representatives of the teachers, teaching assistants and volunteers who have accompanied the initiative, helping bring free community English classes closer to children, grassroots officials and local people. Among them are international friends working legally in Hanoi who are ready to join once the “cultural-exchange stopover” model is implemented within the proper legal framework.","voices":[{"name":"……………………","role_vi":"Bí thư Đoàn phường","role_en":"Ward Youth Union Secretary","quote_vi":"(Điền câu chia sẻ thật của anh/chị về ý nghĩa chương trình đối với địa phương.)","quote_en":"(Insert a real quote about the program’s value to the locality.)","image":""},{"name":"……………………","role_vi":"Tình nguyện viên","role_en":"Volunteer","quote_vi":"(Điền câu chia sẻ thật về trải nghiệm khi tham gia lớp học.)","quote_en":"(Insert a real quote about the volunteering experience.)","image":""},{"name":"……………………","role_vi":"Tình nguyện viên","role_en":"Volunteer","quote_vi":"(Điền câu chia sẻ thật.)","quote_en":"(Insert a real quote.)","image":""},{"name":"……………………","role_vi":"Trợ giảng","role_en":"Teaching assistant","quote_vi":"(Điền câu chia sẻ thật về sự thay đổi của các em học viên.)","quote_en":"(Insert a real quote about the learners’ progress.)","image":""},{"name":"……………………","role_vi":"Trợ giảng","role_en":"Teaching assistant","quote_vi":"(Điền câu chia sẻ thật.)","quote_en":"(Insert a real quote.)","image":""},{"name":"……………………","role_vi":"Học viên (cán bộ phường Thục Phán)","role_en":"Learner (Thuc Phan official)","quote_vi":"(Điền câu chia sẻ thật về việc tiếng Anh hỗ trợ công việc và giao tiếp với khách quốc tế.)","quote_en":"(Insert a real quote on how English helps work and visitor communication.)","image":""},{"name":"……………………","role_vi":"Học viên (cán bộ phường Thục Phán)","role_en":"Learner (Thuc Phan official)","quote_vi":"(Điền câu chia sẻ thật.)","quote_en":"(Insert a real quote.)","image":""},{"name":"……………………","role_vi":"Giáo viên chương trình","role_en":"Program teacher","quote_vi":"(Điền câu chia sẻ thật về hành trình dạy học tại vùng biên.)","quote_en":"(Insert a real quote about teaching in the border region.)","image":""},{"name":"……………………","role_vi":"Giáo viên nước ngoài tại Hà Nội — sẵn sàng tham gia điểm trạm văn hóa","role_en":"Foreign teacher in Hanoi — ready to join the cultural stopover","quote_vi":"Tôi rất sẵn lòng tham gia chương trình giao lưu văn hóa này tại Cao Bằng khi được triển khai theo đúng khung pháp lý. Được giúp các em nhỏ luyện tiếng Anh và giới thiệu về đất nước mình chính là kiểu giao lưu tôi trân trọng.","quote_en":"I’d be glad to join this cultural-exchange programme in Cao Bang once it is set up under the proper legal framework. Helping children practise English and sharing about my own country is exactly the kind of exchange I value.","image":""},{"name":"……………………","role_vi":"Tình nguyện viên nước ngoài tại Hà Nội — sẵn sàng tham gia điểm trạm văn hóa","role_en":"Foreign volunteer in Hanoi — ready to join the cultural stopover","quote_vi":"Sống và làm việc ở Hà Nội, tôi rất thích ý tưởng một “điểm trạm giáo dục” có kiểm soát, nơi du khách và trẻ em địa phương có thể gặp gỡ, học hỏi lẫn nhau. Khi chương trình triển khai hợp pháp, hãy để tôi tham gia.","quote_en":"Living and working in Hanoi, I love the idea of a controlled “education stopover” where travellers and local children can meet and learn from each other. When it launches legally, count me in.","image":""}],"contact":[{"k_vi":"Đơn vị đề xuất","k_en":"Proposed by","v_vi":"Công ty TNHH Giáo dục và Đào tạo Clever Kids (Anh ngữ Clever Junior)","v_en":"Clever Kids Education & Training Co., Ltd (Clever Junior English)"},{"k_vi":"Chủ nhiệm sáng kiến","k_en":"Author","v_vi":"Bà Vũ Kim Dung","v_en":"Ms. Vu Kim Dung"},{"k_vi":"Email liên hệ","k_en":"Contact email","v_vi":"ms.dungvu@gmail.com","v_en":"ms.dungvu@gmail.com"},{"k_vi":"Đơn vị phối hợp","k_en":"Partners","v_vi":"Tỉnh Đoàn Cao Bằng · UBND phường Thục Phán · Đoàn phường Nùng Trí Cao","v_en":"Cao Bang Youth Union · Thuc Phan ward People’s Committee · Nung Tri Cao ward Youth Union"},{"k_vi":"Địa bàn","k_en":"Location","v_vi":"Tỉnh Cao Bằng","v_en":"Cao Bang province, Vietnam"},{"k_vi":"Hạng mục dự thi","k_en":"Award category","v_vi":"Sáng kiến, sản phẩm có giá trị thông tin đối ngoại — Giải thưởng toàn quốc về TTĐN lần thứ XII, 2026","v_en":"Initiative/product of external-information value — 12th National External Information Award, 2026"}],"note_vi":"Nguyên tắc trình bày: phân định rõ phần đã triển khai và phần đề xuất/định hướng; chỉ hợp tác với người nước ngoài hợp pháp; tuân thủ quy định bản quyền, quyền hình ảnh và bảo vệ trẻ em; không sử dụng cho mục đích thương mại. Bản đầy đủ các văn bản phối hợp, đồng thuận và danh sách được nộp kèm hồ sơ cho Ban Tổ chức Giải thưởng.","note_en":"Presentation principle: clearly separate implemented work from proposals; cooperate only with lawfully-present foreigners; comply with copyright, image rights and child protection; no commercial use. Full cooperation/consent documents and name lists are submitted with the dossier to the Award Organising Committee.","foot_vi":"Sáng kiến “Lớp học biên cương - Border Classroom” · Đơn vị đề xuất: Công ty TNHH Giáo dục và Đào tạo Clever Kids (Anh ngữ Clever Junior) · Chủ nhiệm: Bà Vũ Kim Dung. Trung thực – không phóng đại – bảo vệ trẻ em – không thương mại hóa hình ảnh trẻ em.","foot_en":"Initiative “Border Classroom” · Proposed by Clever Kids Education Co., Ltd (Clever Junior English) · Author: Ms. Vu Kim Dung. Honest – no exaggeration – child protection – no commercial use of children’s images.","model_intro_vi":"Có thể hình dung mô hình theo một mạch liền: Lớp tiếng Anh cộng đồng (nền tảng) → Người học kể chuyện quê hương bằng tiếng Anh → Điểm giao lưu văn hóa có kiểm soát với người nước ngoài hợp pháp → Kênh thông tin đối ngoại nhân dân. Mô hình được triển khai theo ba cấu phần:","model_intro_en":"The model can be seen as one continuous flow: community English class (foundation) → learners telling homeland stories in English → controlled cultural-exchange points with lawful foreigners → a people-to-people external-information channel. It is delivered through three components:","components":[{"t_vi":"Lớp tiếng Anh cộng đồng","t_en":"Community English classes","d_vi":"Tổ chức lớp tiếng Anh miễn phí cho trẻ em, cán bộ cơ sở và nhóm đối tượng địa phương có nhu cầu.","d_en":"Free English classes for children, grassroots officials and local groups in need.","status_vi":"Đã triển khai","status_en":"Implemented","sclass":"done"},{"t_vi":"Kể chuyện quê hương bằng tiếng Anh","t_en":"Telling homeland stories in English","d_vi":"Hướng dẫn người học sử dụng tiếng Anh để giới thiệu quê hương, văn hóa, con người Cao Bằng.","d_en":"Guiding learners to use English to introduce Cao Bang’s homeland, culture and people.","status_vi":"Đang chuẩn hóa","status_en":"Being standardised","sclass":"doing"},{"t_vi":"Điểm giao lưu văn hóa có kiểm soát","t_en":"Controlled cultural-exchange points","d_vi":"Từng bước hình thành các điểm giao lưu văn hóa ngắn, có kiểm soát, với khách quốc tế/người nước ngoài hợp pháp; chỉ thực hiện khi đủ điều kiện pháp lý và có giáo viên/cán bộ Việt Nam giám sát.","d_en":"Gradually forming short, controlled cultural-exchange points with lawful international guests; only when legal conditions are met and with Vietnamese teachers/officials supervising.","status_vi":"Định hướng","status_en":"Direction","sclass":"plan"}],"model_note_vi":"Mô hình không đưa người nước ngoài vào giảng dạy độc lập, không thu phí từ trẻ em và không thương mại hóa hình ảnh trẻ em.","model_note_en":"The model does not let foreigners teach independently, charges children nothing, and never commercialises children’s images.","how_vi":"Mỗi lớp do Trung tâm Anh ngữ Clever Junior phối hợp với địa phương tổ chức; giáo viên hợp pháp của Clever Junior trực tiếp giảng dạy cùng trợ giảng, tình nguyện viên; có cán bộ địa phương/giáo viên Việt Nam giám sát. Học viên là trẻ em có hoàn cảnh khó khăn và cán bộ cơ sở. Mỗi buổi kéo dài khoảng 60–90 phút; đầu ra gồm buổi học, ảnh/video minh chứng và các câu chuyện quê hương bằng tiếng Anh.","how_en":"Each class is organised by Clever Junior together with local partners; licensed Clever Junior teachers teach alongside assistants and volunteers, supervised by local officials/Vietnamese teachers. Learners are disadvantaged children and grassroots officials. Each session lasts ~60–90 minutes; outputs include the lesson, photo/video evidence and homeland stories in English.","process":[{"step":"1","task_vi":"Khảo sát nhu cầu địa phương","task_en":"Survey local needs","owner_vi":"Clever Junior + địa phương","owner_en":"Clever Junior + local partners","result_vi":"Danh sách lớp/đối tượng","result_en":"Class/beneficiary list"},{"step":"2","task_vi":"Thiết kế giáo trình song ngữ","task_en":"Design bilingual curriculum","owner_vi":"Đội chuyên môn Clever Junior","owner_en":"Clever Junior team","result_vi":"Bộ bài học song ngữ","result_en":"Bilingual lesson set"},{"step":"3","task_vi":"Tổ chức lớp học","task_en":"Run the class","owner_vi":"Giáo viên hợp pháp + trợ giảng, có giám sát địa phương","owner_en":"Licensed teacher + assistants, with local supervision","result_vi":"Buổi học + ảnh/minh chứng","result_en":"Lessons + photos/evidence"},{"step":"4","task_vi":"Ghi nhận câu chuyện quê hương","task_en":"Capture homeland stories","owner_vi":"Học viên + bộ phận truyền thông","owner_en":"Learners + media","result_vi":"Video/bài viết song ngữ","result_en":"Bilingual videos/articles"},{"step":"5","task_vi":"Đo lường & báo cáo","task_en":"Measure & report","owner_vi":"Ban điều phối","owner_en":"Coordination team","result_vi":"Số lớp, số học viên, phản hồi","result_en":"Classes, learners, feedback"}],"intl_title_vi":"Chiến lược hiện diện số hướng khách quốc tế","intl_title_en":"Digital presence strategy for international visitors","intl_lead_vi":"Thay vì đặt mục tiêu “thu hút khách quốc tế” chung chung, sáng kiến đặt đầu ra của lớp học vào đúng nơi khách quốc tế tìm thông tin, tận dụng đà du lịch Cao Bằng: 6 tháng đầu 2025 đón hơn 1,52 triệu lượt khách (+47,7%), riêng khách quốc tế gần 58.000 lượt (+176,8% so với cùng kỳ).","intl_lead_en":"Instead of a vague goal to “attract foreign visitors”, the initiative places the classroom’s output where international travellers actually look, riding Cao Bang’s tourism momentum: over 1.52 million visitors in H1 2025 (+47.7%), including nearly 58,000 international arrivals (+176.8% year-on-year).","intl_channels_vi":["Google Search & Maps","Blog du lịch (Vietnam Coracle…)","TripAdvisor","Reddit (r/VietnamTravel)","YouTube","Facebook · Instagram · TikTok","Booking · Agoda · Hostelworld"],"intl_channels_en":["Google Search & Maps","Travel blogs (Vietnam Coracle…)","TripAdvisor","Reddit (r/VietnamTravel)","YouTube","Facebook · Instagram · TikTok","Booking · Agoda · Hostelworld"],"intl_actions":[{"t_vi":"Biến đầu ra lớp học thành nội dung tiếng Anh","t_en":"Turn class output into English content","d_vi":"Clip ngắn học viên giới thiệu quê hương bằng tiếng Anh, đăng YouTube và nhúng vào website — đúng chất trải nghiệm chân thực du khách tìm kiếm.","d_en":"Short clips of learners introducing their homeland in English, on YouTube and embedded on the website — the authentic experience travellers seek."},{"t_vi":"Hợp tác kênh sẵn có thay vì dựng từ đầu","t_en":"Partner with existing channels","d_vi":"Gửi câu chuyện tới các blog/hãng lữ hành đang phủ nội dung Cao Bằng để được nhắc tên, liên kết — hiệu quả hơn tự đăng nhiều bài rời rạc.","d_en":"Pitch the story to blogs/tour operators already covering Cao Bang for mentions and links — more effective than scattered self-posting."},{"t_vi":"Hiện diện tại điểm chạm du lịch thật","t_en":"Show up at real tourist touchpoints","d_vi":"Học viên chào hỏi, chỉ đường, giới thiệu bằng tiếng Anh ngay tại Bản Giốc, Phố đi bộ Kim Đồng — trải nghiệm du khách gặp trực tiếp.","d_en":"Learners greeting, giving directions and introductions in English at Ban Gioc and Kim Dong walking street — an experience visitors meet in person."},{"t_vi":"Đo lường trung thực","t_en":"Measure honestly","d_vi":"Theo dõi lượt xem, lượt lưu, chia sẻ và phản hồi của khách quốc tế; không tuyên bố “phủ sóng toàn cầu”.","d_en":"Track views, saves, shares and international feedback; no claims of “global coverage”."}]}
</script>

<script>
let D={}, lang="vi", page=0;
const app=document.getElementById("app"), menuEl=document.getElementById("menu"), footEl=document.getElementById("foot");
function L(o,base){return o[base+"_"+lang]||o[base+"_vi"]||"";}
function tag(cls,txt){return txt?`<span class="tag ${cls}">${txt}</span>`:"";}
function ytId(u){if(!u)return null;const m=String(u).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([\w-]{11})/);return m?m[1]:null;}
function boot(){
  D=JSON.parse(document.getElementById("seed").textContent);           // fallback (mở local)
  fetch("content.json").then(r=>r.ok?r.json():null).then(j=>{if(j){D=j;} render();}).catch(()=>render());
  render();
}
function render(){
  const nav=D["nav_"+lang]||D.nav_vi;
  menuEl.innerHTML=nav.map((n,i)=>`<button class="${i===page?'on':''}" data-p="${i}">${n}</button>`).join("");
  footEl.innerHTML=L(D,"foot");
  document.documentElement.lang=lang;
  app.innerHTML=`<div class="page">${PAGES[page]()}</div>`;
  window.scrollTo({top:0,behavior:"smooth"});
  requestAnimationFrame(checkClamp);
}
const SCENE=`<svg class="scene" viewBox="0 0 600 150" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Minh họa phong cảnh biên cương Cao Bằng">
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b4256"/><stop offset="1" stop-color="#0e4d64"/></linearGradient></defs>
<rect width="600" height="150" fill="url(#sky)"/>
<circle cx="510" cy="38" r="23" fill="#E8A33D" opacity="0.9"/>
<path d="M0 100 L80 55 L160 100 Z" fill="#2E7D8A" opacity="0.4"/>
<path d="M110 100 L210 40 L310 100 Z" fill="#2E7D8A" opacity="0.55"/>
<path d="M270 100 L360 58 L450 100 Z" fill="#2E7D8A" opacity="0.4"/>
<path d="M400 100 L480 50 L560 100 Z" fill="#2E7D8A" opacity="0.5"/>
<g opacity="0.9"><rect x="203" y="58" width="4" height="42" fill="#e3f3f7"/><rect x="209" y="60" width="4" height="40" fill="#f0fafc"/><rect x="215" y="58" width="4" height="42" fill="#e3f3f7"/></g>
<path d="M0 150 L0 108 Q150 86 300 104 T600 100 L600 150 Z" fill="#093446"/>
<path d="M0 120 Q150 100 300 116 T600 112" fill="none" stroke="#0e4d64" stroke-width="2" opacity="0.6"/>
<path d="M0 132 Q150 114 300 128 T600 124" fill="none" stroke="#0e4d64" stroke-width="2" opacity="0.5"/>
<g fill="#08303f"><circle cx="150" cy="119" r="6"/><rect x="145" y="125" width="10" height="17" rx="4"/></g>
<g fill="#08303f"><circle cx="171" cy="123" r="5"/><rect x="167" y="128" width="9" height="15" rx="4"/></g>
<g fill="#08303f"><circle cx="128" cy="123" r="5"/><rect x="124" y="128" width="9" height="15" rx="4"/></g>
</svg>`;
const head=(kick,title)=>`<span class="kicker">${kick}</span><h1 class="title">${title}</h1>`;
const PAGES=[
 ()=>`<div class="hero"><div class="en">${D.hero_en_label||"BORDER CLASSROOM"}</div><h1>${L(D,"hero_title")}</h1><p>${L(D,"hero_desc")}</p>
   <div class="btns"><button class="btn gold" data-p="2">${lang==="vi"?"Xem hành trình":"Our journey"}</button><button class="btn ghost" data-p="5">${lang==="vi"?"Báo chí ghi nhận":"Press coverage"}</button></div>${SCENE}</div>
   <div class="kpis">${D.kpis.map(k=>`<div class="kpi"><div class="n">${k.n}</div><div class="l">${L(k,"l")}</div></div>`).join("")}</div>
   <section class="blk"><div class="hl">${(D.highlights||[]).map(h=>`<div class="hlcard"><h3>${L(h,"title")}</h3><p>${L(h,"desc")}</p></div>`).join("")}</div></section>
   ${(D.press&&D.press.length)?`<section class="blk"><h2>${lang==="vi"?"Tác động & lan tỏa":"Impact & reach"}</h2>${L(D,"reach")?`<p class="lead" style="margin-bottom:14px">${L(D,"reach")}</p>`:""}<div class="recog"><span class="recog-l">${lang==="vi"?"Được ghi nhận bởi:":"Recognised by:"}</span>${[...new Set(D.press.map(p=>p.source))].map(s=>`<span class="rbadge">${s}</span>`).join("")}<button class="rmore" data-p="5">${lang==="vi"?"Xem tất cả →":"See all →"}</button></div></section>`:""}
   <section class="blk"><h2>${lang==="vi"?"Sứ mệnh":"Our mission"}</h2><p class="lead">${L(D,"mission")}</p></section>`,
 ()=>head(lang==="vi"?"Vì sao là Cao Bằng":"Why Cao Bang",lang==="vi"?"Bối cảnh & câu chuyện":"Context & story")
   +D.context.map(c=>`<section class="blk"><h2>${L(c,"h")}</h2><p class="lead">${L(c,"p")}</p></section>`).join(""),
 ()=>head(lang==="vi"?"Kết quả thực tế 2025-2026":"Actual results 2025-2026",lang==="vi"?"Hành trình đã làm":"Our journey")
   +`<section class="blk"><div class="cards">${D.done_cards.map(c=>`<div class="card">${c.image?`<img src="${c.image}" alt="">`:""}<h3>${L(c,"title")}</h3><p>${L(c,"body")}</p>${tag("done",L(c,"tag"))}</div>`).join("")}</div></section>`
   +`<section class="blk"><p class="lead">${L(D,"done_note")}</p></section>`
   +`<section class="blk"><h2>${lang==="vi"?"Hình ảnh & video":"Photos & videos"}</h2><div class="gal">${(D.media||[]).map(g=>{const inner=`<div class="ico">${g.icon||"📎"}</div><b>${L(g,"label")}</b><small>${L(g,"note")}</small>${g.link?`<div><a href="${g.link}" target="_blank" rel="noopener">${lang==="vi"?"Mở trong tab mới":"Open in new tab"}</a></div>`:""}`;const yt=ytId(g.link);if(g.image)return `<div class="ph hasimg"><img src="${g.image}" alt=""><div class="inner">${inner}</div></div>`;if(yt)return `<div class="ph hasimg"><div class="video"><iframe src="https://www.youtube.com/embed/${yt}" title="${L(g,"label")}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div><div class="inner">${inner}</div></div>`;return `<div class="ph">${inner}</div>`;}).join("")}</div></section>`,
 ()=>head(lang==="vi"?"Cấu trúc & cơ chế":"Structure & safeguards",lang==="vi"?"Mô hình":"The model")
   +`<section class="blk"><h2>${lang==="vi"?"Ba cấu phần của mô hình":"Three model components"}</h2><p class="lead">${L(D,"model_intro")}</p><div class="cards" style="margin-top:12px">${(D.components||[]).map(c=>`<div class="card"><h3>${L(c,"t")}</h3><p>${L(c,"d")}</p>${tag(c.sclass||"plan",L(c,"status"))}</div>`).join("")}</div><div class="note">${L(D,"model_note")}</div></section>`
   +`<section class="blk"><h2>${lang==="vi"?"Ba tầng giá trị":"Three value layers"}</h2><div class="tiers">${D.tiers.map(t=>`<div class="tier">${L(t,"a")}<span>${L(t,"b")}</span></div>`).join("")}</div></section>`
   +`<section class="blk"><h2>${lang==="vi"?"Một lớp học vận hành thế nào":"How a class runs"}</h2><p class="lead">${L(D,"how")}</p><div style="overflow-x:auto;margin-top:12px"><table class="ptable"><thead><tr><th>${lang==="vi"?"Bước":"Step"}</th><th>${lang==="vi"?"Việc làm":"Task"}</th><th>${lang==="vi"?"Người phụ trách":"Owner"}</th><th>${lang==="vi"?"Kết quả":"Result"}</th></tr></thead><tbody>${(D.process||[]).map(p=>`<tr><td class="pnum">${p.step}</td><td>${L(p,"task")}</td><td>${L(p,"owner")}</td><td>${L(p,"result")}</td></tr>`).join("")}</tbody></table></div></section>`
   +`<section class="blk"><h2>${lang==="vi"?"Mô hình & an toàn":"Model & safety"}</h2><div class="cards">${D.model_cards.map(c=>`<div class="card"><h3>${L(c,"title")}</h3><p>${L(c,"body")}</p>${tag(c.tagclass||"plan",L(c,"tag"))}</div>`).join("")}</div></section>`,
 ()=>head(lang==="vi"?"Kế hoạch hành động":"Action plan",lang==="vi"?"Lộ trình – Những việc sẽ làm":"Roadmap – what we will do")
   +`<section class="blk"><div class="tl">${D.roadmap.map(s=>`<div class="step"><div class="when">${L(s,"when")}</div><h3>${L(s,"h")}</h3><p>${L(s,"p")} ${tag(s.sclass||"plan",L(s,"s"))}</p></div>`).join("")}</div></section>`
   +(D.intl_title_vi?`<section class="blk"><h2>${L(D,"intl_title")}</h2><p class="lead">${L(D,"intl_lead")}</p>`
     +`<div class="recog" style="margin:14px 0"><span class="recog-l">${lang==="vi"?"Kênh khách quốc tế tìm thông tin:":"Where travellers look:"}</span>${(L(D,"intl_channels")||[]).map(ch=>`<span class="rbadge">${ch}</span>`).join("")}</div>`
     +`<div class="hl">${(D.intl_actions||[]).map(a=>`<div class="hlcard"><h3>${L(a,"t")}</h3><p>${L(a,"d")}</p></div>`).join("")}</div></section>`:""),
 ()=>head(lang==="vi"?"Lan tỏa & tiếng nói thật":"Reach & real voices",lang==="vi"?"Ghi nhận & Chia sẻ":"Recognition & Voices")
   +`<section class="blk"><h2>${lang==="vi"?"Báo chí ghi nhận":"Press coverage"}</h2><div class="press">${(D.press||[]).map(a=>`<a class="pcard" href="${a.url}" target="_blank" rel="noopener">${a.image?`<img src="${a.image}" alt="" loading="lazy">`:""}<span class="psrc">${a.source}</span><span class="ptitle">${L(a,"title")}</span></a>`).join("")}</div></section>`
   +`<section class="blk"><h2>${lang==="vi"?"Người trong cuộc":"Insiders"}</h2><p class="lead">${L(D,"voices_intro")}</p><div class="vgrid" style="margin-top:14px">${(D.voices||[]).map(v=>`<div class="vcard"><div class="vtop">${v.image?`<img src="${v.image}" alt="">`:`<div class="vph">${((v.name||"?").trim()[0]||"?")}</div>`}</div><div class="vquote">${L(v,"quote")}</div><button class="rm">${lang==="vi"?"Đọc thêm":"Read more"}</button><div class="vfoot"><div class="vname">${v.name||"……"}</div><div class="vrole">${L(v,"role")}</div></div></div>`).join("")}</div></section>`,
 ()=>head(lang==="vi"?"Thông tin":"Information",lang==="vi"?"Liên hệ & đơn vị phối hợp":"Contact & partners")
   +`<div class="info">${D.contact.map(r=>`<div class="row"><b>${L(r,"k")}:</b> ${L(r,"v")}</div>`).join("")}</div>`
   +`<div class="note">${L(D,"note")}</div>`
];
function checkClamp(){document.querySelectorAll(".vquote").forEach(q=>{const b=q.nextElementSibling;if(b&&b.classList.contains("rm")){b.style.display=(q.scrollHeight-q.clientHeight>2||q.classList.contains("open"))?"":"none";}});}
document.addEventListener("click",e=>{
  const rm=e.target.closest(".rm"); if(rm){const q=rm.previousElementSibling; q.classList.toggle("open"); rm.textContent=q.classList.contains("open")?(lang==="vi"?"Thu gọn":"Show less"):(lang==="vi"?"Đọc thêm":"Read more"); return;}
  const p=e.target.closest("[data-p]"); if(p){page=+p.dataset.p;render();return;}
  const l=e.target.closest("[data-l]"); if(l){lang=l.dataset.l;document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));render();}
});
boot();
</script>
</body>
</html>
